name: Publish MCP Identity Preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful build and download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName > build.json
          test "$(jq -r .conclusion build.json)" = success
          test "$(jq -r .workflowName build.json)" = "MCP Window Identity Windows Build"
          gh run download "$BUILD_RUN" --dir artifacts
          find artifacts -type f
      - name: Publish Windows x64 preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(jq -r .headSha build.json)
          TAG="mcp-window-identity-${SHA:0:8}"
          ZIP=$(find artifacts -type f -name duckstation-windows-x64-release.zip -print -quit)
          test -n "$ZIP"
          printf '%s\n' 'Native MCP port, owner/task and client identity in all top-level Qt window titles.' '' 'Built from the referenced commit. Native identity lifecycle and concurrency checks run in CI. This preview has not yet completed local visual/runtime acceptance. Owner labels are declared assignments, not locks.' > notes.md
          gh release create "$TAG" "$ZIP" --target "$SHA" --prerelease --title "MCP window identity preview" --notes-file notes.md
